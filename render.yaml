services:
  - type: web
    name: ic-verify-api
    env: node
    buildCommand: npm install
    startCommand: npm run start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
